services:
  # region storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: argon
      MINIO_ROOT_PASSWORD: argon1234
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        set -e;
        echo 'Configuring MinIO client...';
        mc alias set myminio http://minio:9000 argon argon1234 --api S3v4;
        echo 'Creating buckets...';
        mc mb myminio/region1 --ignore-existing;
        mc mb myminio/region2 --ignore-existing;
        echo 'Listing buckets:';
        mc ls myminio;
        echo 'Buckets created successfully';
      "
  # endregion storage
  # region databases
  scylla:
    image: scylladb/scylla:latest
    volumes:
      - scylla:/var/lib/scylla
    command: --smp 1 --memory 264M --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042"
      - "9160:9160"
    environment:
      SCYLLA_CLUSTER_NAME: "scylla_cluster"
      SCYLLA_SEEDS: "scylla"
  pg:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kineticafs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgweb:
    image: sosedoff/pgweb:latest
    command: >
      --bind 0.0.0.0
      --url "postgres://postgres:postgres@pg:5432/kineticafs?sslmode=disable"
    ports:
      - "8081:8081"
    depends_on:
      - pg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  # endregion databases
  # region application
  # kineticafs:
  #   build: .
  #   tty: true
  #   stdin_open: true
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - region1
  #     - region2
  #     - scylla
  #     - pg
  #   environment:
  #     - KINETICAFS_SCYLLA=scylla:9042
  #     - KINETICAFS_POSTGRES=postgres://postgres:postgres@pg:5432/kineticafs?sslmode=disable
  #   restart: unless-stopped
  # endregion application
volumes:
  pgdata: {}
  scylla: {}
  minio-data: {}
